<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонажи</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 20px; text-align: center; }
        .top-bar { display: flex; justify-content: center; align-items: center; max-width: 1200px; margin: 0 auto 20px auto; }
        .search-input { padding: 10px 15px; border-radius: 8px; border: 1px solid #40444b; background-color: #202225; color: white; font-size: 1em; width: 400px; max-width: 100%; outline: none; }
        .search-input:focus { border-color: #7289da; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; margin-bottom: 30px; }
        
        .card { position: relative; background-color: #2f3136; border-radius: 10px; overflow: visible; box-shadow: 0 4px 8px rgba(0,0,0,0.5); transition: transform 0.2s; display: flex; flex-direction: column; cursor: pointer; z-index: 1; }
        .card:hover { transform: scale(1.02); box-shadow: 0 6px 12px rgba(114, 137, 218, 0.3); z-index: 100; }
        
        .card-inner { border-radius: 10px; overflow: hidden; height: 100%; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 220px; object-fit: cover; background-color: #444; pointer-events: none; }
        .card-content { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; pointer-events: none; background-color: #2f3136; }
        .name { font-size: 1.5em; font-weight: 900; margin-bottom: 8px; color: #ffffff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .placeholder { display: flex; align-items: center; justify-content: center; font-size: 3em; color: #555; background-color: #333; height: 220px; pointer-events: none; }
        
        .tooltip-content {
            visibility: hidden; opacity: 0; position: absolute; top: 50%; left: 105%;
            transform: translateY(-50%) translateX(-10px); background-color: #202225;
            border: 1px solid #7289da; border-radius: 8px; padding: 15px;
            width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 1000;
            pointer-events: none; transition: opacity 0.2s, transform 0.2s;
            text-align: left; font-size: 0.85em; color: #dcddde;
        }
        .tooltip-content::before {
            content: ''; position: absolute; top: 50%; right: 100%; transform: translateY(-50%);
            border-width: 8px; border-style: solid; border-color: transparent #7289da transparent transparent;
        }
        .card:hover .tooltip-content { visibility: visible; opacity: 1; transform: translateY(-50%) translateX(10px); }
        
        @media (max-width: 768px) {
            .tooltip-content { left: 0; top: 100%; transform: translateY(10px); width: 100%; }
            .tooltip-content::before { display: none; }
            .card:hover .tooltip-content { transform: translateY(0); }
        }

        .tooltip-row { margin-bottom: 8px; border-bottom: 1px solid #40444b; padding-bottom: 8px; }
        .tooltip-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .tooltip-label { font-weight: bold; color: #7289da; display: block; margin-bottom: 2px; font-size: 0.9em; }
        .tooltip-value { color: #b9bbbe; }
        
        .add-btn-fixed {
            position: fixed; top: 20px; right: 20px; z-index: 1500;
            width: 50px; height: 50px; border-radius: 50%;
            background-color: #43b581; color: white; border: none;
            font-size: 1.8em; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.2s, background-color 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .add-btn-fixed:hover { transform: scale(1.1); background-color: #3ca374; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: #2f3136; border-radius: 10px; width: 100%; max-width: 700px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; text-align: left; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #40444b; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.5em; font-weight: 900; color: #7289da; margin: 0; }
        .close-btn { background: none; border: none; color: #b9bbbe; font-size: 1.5em; cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }
        .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        
        .param-row { display: flex; flex-direction: column; margin-bottom: 15px; border-bottom: 1px solid #40444b; padding-bottom: 15px; }
        .param-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .param-label { font-size: 0.95em; color: #b9bbbe; margin-bottom: 6px; font-weight: bold; }
        .param-input { width: 100%; box-sizing: border-box; background-color: #202225; border: 1px solid #40444b; color: #dcddde; border-radius: 5px; padding: 10px; font-family: inherit; font-size: 0.9em; resize: vertical; min-height: 50px; }
        .param-input:focus { outline: none; border-color: #7289da; }
        
        .card-edit-block { background-color: #36393f; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #40444b; display: none; }
        .card-edit-block.active { display: block; }
        
        .toggle-card-btn { background-color: transparent; color: #7289da; border: 1px dashed #7289da; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 15px; transition: background 0.2s; font-size: 1em; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .toggle-card-btn:hover { background-color: rgba(114, 137, 218, 0.1); }
        
        .current-img-preview { max-width: 100px; max-height: 100px; border-radius: 5px; object-fit: cover; margin-bottom: 10px; border: 2px solid #7289da; display: block; }
        .file-input { color: #b9bbbe; font-size: 0.9em; margin-top: 5px; display: block; }
        
        .create-input { width: 100%; box-sizing: border-box; background-color: #202225; border: 1px solid #40444b; color: #dcddde; border-radius: 5px; padding: 10px; font-family: inherit; font-size: 0.95em; margin-bottom: 10px; }
        .create-input:focus { outline: none; border-color: #7289da; }
        
        .modal-footer { padding: 15px 20px; border-top: 1px solid #40444b; display: flex; flex-direction: column; gap: 10px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; font-size: 0.95em; flex: 1; }
        .btn-save { background-color: #43b581; color: white; }
        .btn-save:hover { background-color: #3ca374; }
        .btn-save:disabled { background-color: #555; cursor: not-allowed; color: #888; }
        .btn-cancel { background-color: #4f545c; color: white; }
        .btn-cancel:hover { background-color: #686d73; }
        
        .btn-delete-trigger { background-color: transparent; color: #f04747; border: 1px solid #f04747; padding: 8px; font-size: 0.85em; opacity: 0.7; transition: all 0.2s; margin-top: 5px; }
        .btn-delete-trigger:hover { opacity: 1; background-color: rgba(240, 71, 71, 0.1); }
        
        .status-msg { font-size: 0.8em; color: #43b581; text-align: center; height: 15px; margin-top: 5px; }
    </style>
</head>
<body>

    <button class="add-btn-fixed" onclick="openCreateModal()" title="Добавить персонажа">+</button>

    <div class="top-bar">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Поиск по имени..." oninput="filterCards()">
    </div>

    <div class="grid-container" id="character-grid"></div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОСМОТРА/РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="character-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Имя Персонажа</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <div class="btn-group">
                    <button class="btn btn-save" id="save-btn" onclick="saveCharacterData()">Сохранить анкету</button>
                    <button class="btn btn-cancel" onclick="closeModal()">Отменить</button>
                </div>
                <button class="btn btn-delete-trigger" id="delete-btn" onclick="deleteCharacter()">Удалить персонажа...</button>
                <div class="status-msg" id="save-status"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ СОЗДАНИЯ -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Новый персонаж</h2>
                <button class="close-btn" onclick="closeCreateModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label class="param-label">Имя персонажа (обязательно)</label>
                <input type="text" id="new-char-name" class="create-input" placeholder="Например: Ариан">
                
                <label class="param-label">Картинка (файл)</label>
                <input type="file" id="new-char-image" class="file-input" accept="image/*">
                <label class="param-label" style="margin-top: 10px;">...или ссылка на картинку</label>
                <input type="text" id="new-char-image-url" class="create-input" placeholder="https://...">
                
                <div id="create-fields-container"></div>
            </div>
            <div class="modal-footer">
                <div class="btn-group">
                    <button class="btn btn-save" id="create-save-btn" onclick="createCharacter()">Добавить</button>
                    <button class="btn btn-cancel" onclick="closeCreateModal()">Отмена</button>
                </div>
                <div class="status-msg" id="create-status"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://rjverbkytjophdcrqmal.supabase.co';
        const supabaseKey = 'sb_publishable_KWhRUVydfD8WsBHisoG5aQ_lhAi9Xu4'; 

        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const DELETE_PASSWORD = 'jupers';

        const baseCharacters = [
            { id: 'arian', name: 'Ариан', img: 'arian.png' },
            { id: 'zarya', name: 'Заря', img: '' },
            { id: 'luuna', name: 'Лууна', img: '' },
            { id: 'jannet', name: 'Джаннет', img: '' },
            { id: 'luitgard', name: 'Луитгард', img: '' },
            { id: 'ashira', name: 'Ашира', img: '' },
            { id: 'raik', name: 'Райк', img: 'raik.png' },
            { id: 'sakuna', name: 'Сакуна', img: 'sakuna.png' },
            { id: 'ametisa', name: 'Аметиса', img: 'ametisa.png' },
            { id: 'shikhori', name: 'Шихори', img: 'shikhori.png' },
            { id: 'filisi', name: 'Филиси', img: '' },
            { id: 'puret', name: 'Пурет', img: 'puret.png' },
            { id: 'kokomi', name: 'Кокоми', img: '' },
            { id: 'kasdeya', name: 'Касдея', img: '' },
            { id: 'alexandra', name: 'Александра', img: '' }
        ];

        let allCharacters = [...baseCharacters];

        const paramsList = [
            { key: "age_status", label: "Возраст и статус" },
            { key: "physical_traits", label: "Физические черты" },
            { key: "special_marks", label: "Особые приметы" },
            { key: "clothing_style", label: "Одежда" },
            { key: "personality_type", label: "Тип личности" },
            { key: "weaknesses", label: "Слабости и недостатки" },
            { key: "motivation", label: "Главная мотивация" },
            { key: "social_circle", label: "Круг общения" }
        ];

        let currentCharId = null;
        let currentImgUrl = '';
        let realtimeChannel = null;
        let hasUnsavedChanges = false;
        let globalUpdateTimeout = null; // Для дебаунса

        async function init() {
            const { data, error } = await supabaseClient.from('characters').select('*');
            if (!error && data) {
                data.forEach(dbChar => {
                    const existing = allCharacters.find(c => c.id === dbChar.id);
                    if (existing) {
                        Object.assign(existing, dbChar);
                        if (dbChar.img_url) existing.img = dbChar.img_url; 
                        if (dbChar.name) existing.name = dbChar.name;
                    } else if (dbChar.name) {
                        allCharacters.push(dbChar);
                    }
                });
            }
            renderCards();
            subscribeToGlobalUpdates();
        }

        // --- ГЛОБАЛЬНАЯ ПОДПИСКА НА ОБНОВЛЕНИЯ ---
        function subscribeToGlobalUpdates() {
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            
            realtimeChannel = supabaseClient
                .channel('global-characters-changes')
                .on(
                    'postgres_changes', 
                    { event: '*', schema: 'public', table: 'characters' }, 
                    (payload) => {
                        if (payload.eventType === 'UPDATE') {
                            const index = allCharacters.findIndex(c => c.id === payload.new.id);
                            if (index !== -1) {
                                Object.assign(allCharacters[index], payload.new);
                                updateCardTooltip(payload.new.id);
                            }
                        } else if (payload.eventType === 'INSERT') {
                            if (!allCharacters.find(c => c.id === payload.new.id)) {
                                allCharacters.push(payload.new);
                            }
                        } else if (payload.eventType === 'DELETE') {
                            allCharacters = allCharacters.filter(c => c.id !== payload.old.id);
                        }

                        // Дебаунс: ждём 100 мс, чтобы собрать все изменения, и обновляем интерфейс
                        if (globalUpdateTimeout) clearTimeout(globalUpdateTimeout);
                        globalUpdateTimeout = setTimeout(() => {
                            const isModalOpen = document.getElementById('character-modal').classList.contains('active');
                            if (!isModalOpen) {
                                renderCards();
                            }
                        }, 100);
                    }
                )
                .subscribe();
        }

        function updateCardTooltip(charId) {
            const card = document.querySelector(`.card[data-id="${charId}"]`);
            if (!card) return;
            const char = allCharacters.find(c => c.id === charId);
            if (!char) return;
            const tooltip = card.querySelector('.tooltip-content');
            if (tooltip) {
                const newTooltipHTML = generateTooltipHTML(char);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = newTooltipHTML;
                const newTooltipInner = tempDiv.firstElementChild.innerHTML;
                tooltip.innerHTML = newTooltipInner;
            }
        }

        function generateTooltipHTML(char) {
            let hasData = false;
            let html = '';

            paramsList.forEach(param => {
                const val = char[param.key];
                if (val && val.trim() !== '') {
                    hasData = true;
                    html += `
                        <div class="tooltip-row">
                            <span class="tooltip-label">${param.label}:</span>
                            <span class="tooltip-value">${val}</span>
                        </div>
                    `;
                }
            });

            if (!hasData) {
                return `<div class="tooltip-content"><div style="text-align:center; color:#888;">Нет данных об этом персонаже</div></div>`;
            }

            return `<div class="tooltip-content">${html}</div>`;
        }

        function renderCards() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';
            
            const sorted = [...allCharacters].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            sorted.forEach(char => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(char.id);
                card.dataset.id = char.id;
                card.dataset.name = (char.name || '').toLowerCase(); 
                
                let imgHtml = '';
                if (char.img && char.img.trim() !== '') {
                    imgHtml = `<img src="${char.img}" alt="${char.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;
                }
                let placeholderHtml = `<div class="placeholder" style="${char.img ? 'display:none;' : 'display:flex;'}">?</div>`;
                const textHtml = `<div class="card-content"><div class="name">${char.name}</div></div>`;
                const tooltipHtml = generateTooltipHTML(char);

                card.innerHTML = `
                    <div class="card-inner">
                        ${imgHtml}
                        ${placeholderHtml}
                        ${textHtml}
                    </div>
                    ${tooltipHtml}
                `;
                
                grid.appendChild(card);
            });
            
            filterCards();
        }

        function filterCards() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                const name = card.dataset.name;
                if (name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        async function openModal(charId) {
            currentCharId = charId;
            hasUnsavedChanges = false;
            const char = allCharacters.find(c => c.id === charId);
            currentImgUrl = char.img || ''; 
            
            document.getElementById('modal-title').textContent = char.name;
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = ''; 
            document.getElementById('save-status').textContent = 'Загрузка...';
            document.getElementById('save-btn').disabled = true;
            document.getElementById('delete-btn').style.display = 'block';
            document.getElementById('delete-btn').disabled = false;

            const toggleCardBtn = document.createElement('button');
            toggleCardBtn.className = 'toggle-card-btn';
            toggleCardBtn.id = 'toggle-card-btn';
            toggleCardBtn.innerHTML = '📝 Карточка персонажа (Имя и Картинка)';
            toggleCardBtn.onclick = function() {
                const cardBlock = document.getElementById('card-edit-block');
                if (cardBlock.classList.contains('active')) {
                    cardBlock.classList.remove('active');
                    this.innerHTML = '📝 Карточка персонажа (Имя и Картинка)';
                } else {
                    cardBlock.classList.add('active');
                    this.innerHTML = '⬆️ Скрыть настройки карточки';
                }
            };
            modalBody.appendChild(toggleCardBtn);

            const cardBlock = document.createElement('div');
            cardBlock.className = 'card-edit-block';
            cardBlock.id = 'card-edit-block';
            
            let previewHtml = '';
            if (currentImgUrl) {
                previewHtml = `<img src="${currentImgUrl}" class="current-img-preview" id="modal-img-preview">`;
            } else {
                previewHtml = `<div id="modal-img-preview" style="width:100px; height:100px; background:#222; border-radius:5px; display:flex; align-items:center; justify-content:center; color:#555; margin-bottom:10px; font-size:2em;">?</div>`;
            }

            cardBlock.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <label class="param-label">Имя персонажа</label>
                    <input type="text" class="param-input" id="input-name" value="${char.name}" style="min-height: auto;">
                </div>
                <div>
                    <label class="param-label">Картинка (файл или ссылка)</label>
                    ${previewHtml}
                    <input type="file" id="edit-char-image" class="file-input" accept="image/*">
                    <input type="text" id="edit-char-image-url" class="param-input" placeholder="...или вставьте ссылку (https://...)" style="margin-top: 5px; min-height: auto;">
                    <span style="font-size:0.75em; color:#888;">(Файл имеет приоритет над ссылкой)</span>
                </div>
            `;
            modalBody.appendChild(cardBlock);

            document.getElementById('edit-char-image').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('modal-img-preview').outerHTML = `<img src="${e.target.result}" class="current-img-preview" id="modal-img-preview">`;
                    };
                    reader.readAsDataURL(e.target.files[0]);
                    document.getElementById('edit-char-image-url').value = ''; 
                    markUnsaved();
                }
            });

            document.getElementById('edit-char-image-url').addEventListener('input', function(e) {
                const url = e.target.value.trim();
                if (url) {
                    document.getElementById('modal-img-preview').outerHTML = `<img src="${url}" class="current-img-preview" id="modal-img-preview" onerror="this.src=''; this.style.display='none';">`;
                    document.getElementById('edit-char-image').value = ''; 
                }
                markUnsaved();
            });

            paramsList.forEach(param => {
                const row = document.createElement('div');
                row.className = 'param-row';
                row.innerHTML = `
                    <label class="param-label">${param.label}</label>
                    <textarea class="param-input" id="input-${param.key}" placeholder="Загрузка..."></textarea>
                `;
                modalBody.appendChild(row);
            });

            const { data, error } = await supabaseClient.from('characters').select('*').eq('id', charId).single();
            if (error && error.code !== 'PGRST116') {
                document.getElementById('save-status').textContent = 'Ошибка загрузки';
                return;
            }

            const charData = data || {};
            Object.assign(char, charData);

            const nameInput = document.getElementById('input-name');
            nameInput.value = charData.name || char.name;
            nameInput.addEventListener('input', markUnsaved);

            if (charData.img_url && charData.img_url.startsWith('http')) {
                document.getElementById('edit-char-image-url').value = charData.img_url;
            }

            paramsList.forEach(param => {
                const textarea = document.getElementById(`input-${param.key}`);
                if (textarea) {
                    textarea.value = charData[param.key] || '';
                    textarea.addEventListener('input', markUnsaved);
                }
            });

            document.getElementById('save-status').textContent = '';
            document.getElementById('save-btn').disabled = false;
            document.getElementById('save-btn').style.backgroundColor = '#43b581';

            document.getElementById('character-modal').classList.add('active');
        }

        function markUnsaved() {
            hasUnsavedChanges = true;
            document.getElementById('save-btn').disabled = false;
            document.getElementById('save-status').textContent = 'Есть несохраненные изменения';
            document.getElementById('save-status').style.color = '#f0a040';
        }

        async function saveCharacterData() {
            if (!currentCharId) return;
            const saveBtn = document.getElementById('save-btn');
            const statusMsg = document.getElementById('save-status');
            
            const newName = document.getElementById('input-name').value.trim();
            if (!newName) {
                statusMsg.textContent = 'Ошибка: имя не может быть пустым!';
                statusMsg.style.color = '#f04747';
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';
            statusMsg.textContent = 'Отправка данных...';
            statusMsg.style.color = '#b9bbbe';

            let finalImgUrl = currentImgUrl;

            const urlInput = document.getElementById('edit-char-image-url').value.trim();
            if (urlInput) {
                finalImgUrl = urlInput;
            }

            const fileInput = document.getElementById('edit-char-image');
            if (fileInput && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `edit_${currentCharId}_${Date.now()}.${fileExt}`;

                statusMsg.textContent = 'Загрузка картинки...';
                const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(fileName, file);

                if (uploadError) {
                    statusMsg.textContent = 'Ошибка картинки: ' + uploadError.message;
                    statusMsg.style.color = '#f04747';
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Сохранить анкету';
                    return;
                }

                const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                finalImgUrl = urlData.publicUrl;
            }

            const updateData = { 
                id: currentCharId, 
                name: newName,
                img_url: finalImgUrl 
            };
            paramsList.forEach(param => {
                const textarea = document.getElementById(`input-${param.key}`);
                if (textarea) updateData[param.key] = textarea.value;
            });

            const { error } = await supabaseClient.from('characters').upsert(updateData, { onConflict: 'id' });

            if (error) {
                statusMsg.textContent = 'Ошибка: ' + error.message;
                statusMsg.style.color = '#f04747';
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить анкету';
            } else {
                statusMsg.textContent = 'Анкета сохранена!';
                statusMsg.style.color = '#43b581';
                hasUnsavedChanges = false;
                saveBtn.disabled = true;
                
                const char = allCharacters.find(c => c.id === currentCharId);
                if (char) {
                    char.img = finalImgUrl;
                    char.name = newName;
                    Object.assign(char, updateData);
                }
                // Глобальная подписка сама перерисует карточки с задержкой.
                // Но чтобы не было "моргания", принудительно обновим тултип и имя сразу
                updateCardTooltip(currentCharId);
                renderCards(); 

                setTimeout(() => { if (!hasUnsavedChanges) statusMsg.textContent = ''; }, 3000);
                saveBtn.textContent = 'Сохранить анкету';
            }
        }

        async function deleteCharacter() {
            if (!currentCharId) return;
            
            if (!confirm('ВНИМАНИЕ! Вы собираетесь удалить этого персонажа навсегда. Продолжить?')) {
                return;
            }

            const passwordInput = prompt('Для подтверждения удаления введите пароль:');
            
            if (passwordInput !== DELETE_PASSWORD) {
                alert('Неверный пароль! Удаление отменено.');
                return;
            }

            const statusMsg = document.getElementById('save-status');
            statusMsg.textContent = 'Удаление...';
            statusMsg.style.color = '#b9bbbe';
            document.getElementById('delete-btn').disabled = true;

            const { error } = await supabaseClient.from('characters').delete().eq('id', currentCharId);

            if (error) {
                statusMsg.textContent = 'Ошибка удаления: ' + error.message;
                statusMsg.style.color = '#f04747';
                document.getElementById('delete-btn').disabled = false;
            } else {
                allCharacters = allCharacters.filter(c => c.id !== currentCharId);
                renderCards();
                closeModal();
                alert('Персонаж успешно удален.');
            }
        }

        function closeModal() {
            if (hasUnsavedChanges) {
                if (!confirm('У тебя есть несохраненные изменения. Точно закрыть?')) return;
            }
            document.getElementById('character-modal').classList.remove('active');
            currentCharId = null;
            hasUnsavedChanges = false;
        }

        function openCreateModal() {
            document.getElementById('new-char-name').value = '';
            document.getElementById('new-char-image').value = '';
            document.getElementById('new-char-image-url').value = '';
            document.getElementById('create-status').textContent = '';
            const container = document.getElementById('create-fields-container');
            container.innerHTML = '';
            paramsList.forEach(param => {
                const row = document.createElement('div');
                row.className = 'param-row';
                row.innerHTML = `<label class="param-label">${param.label}</label><textarea class="param-input" id="create-input-${param.key}"></textarea>`;
                container.appendChild(row);
            });
            document.getElementById('create-modal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.remove('active');
        }

        async function createCharacter() {
            const name = document.getElementById('new-char-name').value.trim();
            if (!name) {
                document.getElementById('create-status').textContent = 'Ошибка: введите имя!';
                document.getElementById('create-status').style.color = '#f04747';
                return;
            }

            const createBtn = document.getElementById('create-save-btn');
            const statusMsg = document.getElementById('create-status');
            createBtn.disabled = true;
            statusMsg.textContent = 'Создание...';
            statusMsg.style.color = '#b9bbbe';

            const id = name.toLowerCase().replace(/[^a-zа-я0-9]/g, '') + '_' + Date.now();
            let imgUrl = '';

            const fileInput = document.getElementById('new-char-image');
            const urlInput = document.getElementById('new-char-image-url').value.trim();

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${id}.${fileExt}`;
                statusMsg.textContent = 'Загрузка картинки...';
                
                const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(fileName, file);
                if (uploadError) {
                    statusMsg.textContent = 'Ошибка картинки: ' + uploadError.message;
                    statusMsg.style.color = '#f04747';
                    createBtn.disabled = false;
                    return;
                }
                const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                imgUrl = urlData.publicUrl;
            } else if (urlInput) {
                imgUrl = urlInput;
            }

            const newData = { id: id, name: name, img_url: imgUrl };
            paramsList.forEach(param => {
                const textarea = document.getElementById(`create-input-${param.key}`);
                if (textarea && textarea.value.trim() !== '') newData[param.key] = textarea.value;
            });

            const { error } = await supabaseClient.from('characters').insert([newData]);

            if (error) {
                statusMsg.textContent = 'Ошибка: ' + error.message;
                statusMsg.style.color = '#f04747';
                createBtn.disabled = false;
            } else {
                allCharacters.push(newData);
                renderCards();
                statusMsg.textContent = 'Персонаж добавлен!';
                statusMsg.style.color = '#43b581';
                setTimeout(() => { closeCreateModal(); createBtn.disabled = false; }, 1000);
            }
        }

        document.getElementById('character-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.getElementById('create-modal').addEventListener('click', function(e) { if (e.target === this) closeCreateModal(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('character-modal').classList.contains('active')) closeModal();
                if (document.getElementById('create-modal').classList.contains('active')) closeCreateModal();
            }
        });

        init();
    </script>
</body>
</html>
