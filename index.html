<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонажи (Supabase)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 20px; text-align: center; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; margin-bottom: 30px; }
        .card { background-color: #2f3136; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); transition: transform 0.2s; display: flex; flex-direction: column; cursor: pointer; }
        .card:hover { transform: scale(1.02); box-shadow: 0 6px 12px rgba(114, 137, 218, 0.3); }
        .card img { width: 100%; height: 220px; object-fit: cover; background-color: #444; pointer-events: none; }
        .card-content { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; pointer-events: none; }
        .name { font-size: 1.5em; font-weight: 900; margin-bottom: 8px; color: #ffffff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .placeholder { display: flex; align-items: center; justify-content: center; font-size: 3em; color: #555; background-color: #333; height: 220px; pointer-events: none; }
        
        .add-btn { padding: 12px 24px; background-color: #43b581; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: background-color 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .add-btn:hover { background-color: #3ca374; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: #2f3136; border-radius: 10px; width: 100%; max-width: 700px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; text-align: left; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #40444b; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.5em; font-weight: 900; color: #7289da; margin: 0; }
        .close-btn { background: none; border: none; color: #b9bbbe; font-size: 1.5em; cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }
        .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        
        .param-row { display: flex; flex-direction: column; margin-bottom: 15px; border-bottom: 1px solid #40444b; padding-bottom: 15px; }
        .param-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .param-label { font-size: 0.95em; color: #b9bbbe; margin-bottom: 6px; font-weight: bold; }
        .param-input { width: 100%; box-sizing: border-box; background-color: #202225; border: 1px solid #40444b; color: #dcddde; border-radius: 5px; padding: 10px; font-family: inherit; font-size: 0.9em; resize: vertical; min-height: 50px; }
        .param-input:focus { outline: none; border-color: #7289da; }
        
        .image-edit-block { background-color: #36393f; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #40444b; }
        .current-img-preview { max-width: 100px; max-height: 100px; border-radius: 5px; object-fit: cover; margin-bottom: 10px; border: 2px solid #7289da; display: block; }
        .file-input { color: #b9bbbe; font-size: 0.9em; margin-top: 5px; display: block; }
        
        .create-input { width: 100%; box-sizing: border-box; background-color: #202225; border: 1px solid #40444b; color: #dcddde; border-radius: 5px; padding: 10px; font-family: inherit; font-size: 0.95em; margin-bottom: 10px; }
        .create-input:focus { outline: none; border-color: #7289da; }
        
        .modal-footer { padding: 15px 20px; border-top: 1px solid #40444b; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; font-size: 0.95em; flex: 1; }
        .btn-save { background-color: #43b581; color: white; }
        .btn-save:hover { background-color: #3ca374; }
        .btn-save:disabled { background-color: #555; cursor: not-allowed; color: #888; }
        .btn-cancel { background-color: #4f545c; color: white; }
        .btn-cancel:hover { background-color: #686d73; }
        .status-msg { font-size: 0.8em; color: #43b581; text-align: center; height: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="grid-container" id="character-grid"></div>
    
    <button class="add-btn" onclick="openCreateModal()">+ Добавить персонажа</button>

    <!-- МОДАЛЬНОЕ ОКНО ПРОСМОТРА/РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="character-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Имя Персонажа</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Сюда вставляется блок с именем, картинкой и поля -->
            </div>
            <div class="modal-footer">
                <div class="btn-group">
                    <button class="btn btn-save" id="save-btn" onclick="saveCharacterData()">Сохранить анкету</button>
                    <button class="btn btn-cancel" onclick="closeModal()">Отменить</button>
                </div>
                <div class="status-msg" id="save-status"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ СОЗДАНИЯ -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Новый персонаж</h2>
                <button class="close-btn" onclick="closeCreateModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label class="param-label">Имя персонажа (обязательно)</label>
                <input type="text" id="new-char-name" class="create-input" placeholder="Например: Ариан">
                
                <label class="param-label">Картинка (необязательно)</label>
                <input type="file" id="new-char-image" class="file-input" accept="image/*">
                
                <div id="create-fields-container"></div>
            </div>
            <div class="modal-footer">
                <div class="btn-group">
                    <button class="btn btn-save" id="create-save-btn" onclick="createCharacter()">Добавить</button>
                    <button class="btn btn-cancel" onclick="closeCreateModal()">Отмена</button>
                </div>
                <div class="status-msg" id="create-status"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://rjverbkytjophdcrqmal.supabase.co';
        const supabaseKey = 'sb_publishable_KWhRUVydfD8WsBHisoG5aQ_lhAi9Xu4'; 

        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const baseCharacters = [
            { id: 'arian', name: 'Ариан', img: 'arian.png' },
            { id: 'zarya', name: 'Заря', img: '' },
            { id: 'luuna', name: 'Лууна', img: '' },
            { id: 'jannet', name: 'Джаннет', img: '' },
            { id: 'luitgard', name: 'Луитгард', img: '' },
            { id: 'ashira', name: 'Ашира', img: '' },
            { id: 'raik', name: 'Райк', img: 'raik.png' },
            { id: 'sakuna', name: 'Сакуна', img: 'sakuna.png' },
            { id: 'ametisa', name: 'Аметиса', img: 'ametisa.png' },
            { id: 'shikhori', name: 'Шихори', img: 'shikhori.png' },
            { id: 'filisi', name: 'Филиси', img: '' },
            { id: 'puret', name: 'Пурет', img: 'puret.png' },
            { id: 'kokomi', name: 'Кокоми', img: '' },
            { id: 'kasdeya', name: 'Касдея', img: '' },
            { id: 'alexandra', name: 'Александра', img: '' }
        ];

        let allCharacters = [...baseCharacters];

        const paramsList = [
            { key: "age_status", label: "Возраст и статус" },
            { key: "physical_traits", label: "Физические черты" },
            { key: "special_marks", label: "Особые приметы" },
            { key: "clothing_style", label: "Одежда" },
            { key: "personality_type", label: "Тип личности" },
            { key: "weaknesses", label: "Слабости и недостатки" },
            { key: "motivation", label: "Главная мотивация" },
            { key: "social_circle", label: "Круг общения" }
        ];

        let currentCharId = null;
        let currentImgUrl = '';
        let realtimeChannel = null;
        let hasUnsavedChanges = false;

        async function init() {
            const { data, error } = await supabaseClient.from('characters').select('id, name, img_url');
            if (!error && data) {
                data.forEach(dbChar => {
                    const existing = allCharacters.find(c => c.id === dbChar.id);
                    if (existing) {
                        if (dbChar.img_url) existing.img = dbChar.img_url; 
                        if (dbChar.name) existing.name = dbChar.name; // Подтягиваем переименованных
                    } else if (dbChar.name) {
                        allCharacters.push({ id: dbChar.id, name: dbChar.name, img: dbChar.img_url || '' });
                    }
                });
            }
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';
            allCharacters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(char.id);
                let imgHtml = '';
                if (char.img && char.img.trim() !== '') {
                    imgHtml = `<img src="${char.img}" alt="${char.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;
                }
                let placeholderHtml = `<div class="placeholder" style="${char.img ? 'display:none;' : 'display:flex;'}">?</div>`;
                const textHtml = `<div class="card-content"><div class="name">${char.name}</div></div>`;
                card.innerHTML = imgHtml + placeholderHtml + textHtml;
                grid.appendChild(card);
            });
        }

        // --- РЕДАКТИРОВАНИЕ ---
        async function openModal(charId) {
            currentCharId = charId;
            hasUnsavedChanges = false;
            const char = allCharacters.find(c => c.id === charId);
            currentImgUrl = char.img || ''; 
            
            document.getElementById('modal-title').textContent = char.name;
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = ''; 
            document.getElementById('save-status').textContent = 'Загрузка...';
            document.getElementById('save-btn').disabled = true;

            // 1. Поле Имени
            const nameRow = document.createElement('div');
            nameRow.className = 'param-row';
            nameRow.innerHTML = `
                <label class="param-label">Имя персонажа</label>
                <input type="text" class="param-input" id="input-name" value="${char.name}" style="min-height: auto;">
            `;
            modalBody.appendChild(nameRow);

            // 2. Блок с изменением картинки
            const imageBlock = document.createElement('div');
            imageBlock.className = 'image-edit-block';
            
            let previewHtml = '';
            if (currentImgUrl) {
                previewHtml = `<img src="${currentImgUrl}" class="current-img-preview" id="modal-img-preview">`;
            } else {
                previewHtml = `<div id="modal-img-preview" style="width:100px; height:100px; background:#222; border-radius:5px; display:flex; align-items:center; justify-content:center; color:#555; margin-bottom:10px; font-size:2em;">?</div>`;
            }

            imageBlock.innerHTML = `
                <label class="param-label">Картинка персонажа</label>
                ${previewHtml}
                <input type="file" id="edit-char-image" class="file-input" accept="image/*">
                <span style="font-size:0.75em; color:#888;">(Выберите новый файл, чтобы заменить)</span>
            `;
            modalBody.appendChild(imageBlock);

            // Слушатель для предпросмотра картинки
            document.getElementById('edit-char-image').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('modal-img-preview').outerHTML = `<img src="${e.target.result}" class="current-img-preview" id="modal-img-preview">`;
                    };
                    reader.readAsDataURL(e.target.files[0]);
                    markUnsaved();
                }
            });

            // 3. Текстовые поля
            paramsList.forEach(param => {
                const row = document.createElement('div');
                row.className = 'param-row';
                row.innerHTML = `
                    <label class="param-label">${param.label}</label>
                    <textarea class="param-input" id="input-${param.key}" placeholder="Загрузка..."></textarea>
                `;
                modalBody.appendChild(row);
            });

            // 4. Загрузка данных из БД
            const { data, error } = await supabaseClient.from('characters').select('*').eq('id', charId).single();
            if (error && error.code !== 'PGRST116') {
                document.getElementById('save-status').textContent = 'Ошибка загрузки';
                return;
            }

            const charData = data || {};
            
            // Заполняем имя (если в базе есть, иначе локальное)
            const nameInput = document.getElementById('input-name');
            nameInput.value = charData.name || char.name;
            nameInput.addEventListener('input', markUnsaved);

            // Заполняем остальные поля
            paramsList.forEach(param => {
                const textarea = document.getElementById(`input-${param.key}`);
                if (textarea) {
                    textarea.value = charData[param.key] || '';
                    textarea.addEventListener('input', markUnsaved);
                }
            });

            document.getElementById('save-status').textContent = '';
            document.getElementById('save-btn').disabled = false;
            document.getElementById('save-btn').style.backgroundColor = '#43b581';

            document.getElementById('character-modal').classList.add('active');
            subscribeToRealtime(charId);
        }

        function markUnsaved() {
            hasUnsavedChanges = true;
            document.getElementById('save-btn').disabled = false;
            document.getElementById('save-status').textContent = 'Есть несохраненные изменения';
            document.getElementById('save-status').style.color = '#f0a040';
        }

        function subscribeToRealtime(charId) {
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            realtimeChannel = supabaseClient
                .channel('char-changes-' + charId)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'characters', filter: `id=eq.${charId}` }, (payload) => {
                    if (currentCharId === charId && !hasUnsavedChanges) {
                        // Если кто-то изменил данные, а мы ничего не трогали — обновляем
                        if (document.activeElement !== document.getElementById('input-name')) {
                            document.getElementById('input-name').value = payload.new.name || '';
                        }
                        paramsList.forEach(param => {
                            const textarea = document.getElementById(`input-${param.key}`);
                            if (textarea && document.activeElement !== textarea) {
                                textarea.value = payload.new[param.key] || '';
                            }
                        });
                    }
                }).subscribe();
        }

        // --- СОХРАНЕНИЕ ---
        async function saveCharacterData() {
            if (!currentCharId) return;
            const saveBtn = document.getElementById('save-btn');
            const statusMsg = document.getElementById('save-status');
            
            const newName = document.getElementById('input-name').value.trim();
            if (!newName) {
                statusMsg.textContent = 'Ошибка: имя не может быть пустым!';
                statusMsg.style.color = '#f04747';
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';
            statusMsg.textContent = 'Отправка данных...';
            statusMsg.style.color = '#b9bbbe';

            let finalImgUrl = currentImgUrl;

            // 1. Если выбрана новая картинка — загружаем
            const fileInput = document.getElementById('edit-char-image');
            if (fileInput && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `edit_${currentCharId}_${Date.now()}.${fileExt}`;

                statusMsg.textContent = 'Загрузка картинки...';
                const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(fileName, file);

                if (uploadError) {
                    statusMsg.textContent = 'Ошибка картинки: ' + uploadError.message;
                    statusMsg.style.color = '#f04747';
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Сохранить анкету';
                    return;
                }

                const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                finalImgUrl = urlData.publicUrl;
            }

            // 2. Собираем текст
            const updateData = { 
                id: currentCharId, 
                name: newName,
                img_url: finalImgUrl 
            };
            paramsList.forEach(param => {
                const textarea = document.getElementById(`input-${param.key}`);
                if (textarea) updateData[param.key] = textarea.value;
            });

            // 3. Отправляем в БД
            const { error } = await supabaseClient.from('characters').upsert(updateData, { onConflict: 'id' });

            if (error) {
                statusMsg.textContent = 'Ошибка: ' + error.message;
                statusMsg.style.color = '#f04747';
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить анкету';
            } else {
                statusMsg.textContent = 'Анкета сохранена!';
                statusMsg.style.color = '#43b581';
                hasUnsavedChanges = false;
                saveBtn.disabled = true;
                
                // Обновляем имя и картинку в локальном массиве и на главной
                const char = allCharacters.find(c => c.id === currentCharId);
                if (char) {
                    char.img = finalImgUrl;
                    char.name = newName;
                }
                renderCards();

                setTimeout(() => { if (!hasUnsavedChanges) statusMsg.textContent = ''; }, 3000);
                saveBtn.textContent = 'Сохранить анкету';
            }
        }

        function closeModal() {
            if (hasUnsavedChanges) {
                if (!confirm('У тебя есть несохраненные изменения. Точно закрыть?')) return;
            }
            document.getElementById('character-modal').classList.remove('active');
            currentCharId = null;
            hasUnsavedChanges = false;
            if (realtimeChannel) { supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
        }

        // --- СОЗДАНИЕ ---
        function openCreateModal() {
            document.getElementById('new-char-name').value = '';
            document.getElementById('new-char-image').value = '';
            document.getElementById('create-status').textContent = '';
            const container = document.getElementById('create-fields-container');
            container.innerHTML = '';
            paramsList.forEach(param => {
                const row = document.createElement('div');
                row.className = 'param-row';
                row.innerHTML = `<label class="param-label">${param.label}</label><textarea class="param-input" id="create-input-${param.key}"></textarea>`;
                container.appendChild(row);
            });
            document.getElementById('create-modal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.remove('active');
        }

        async function createCharacter() {
            const name = document.getElementById('new-char-name').value.trim();
            if (!name) {
                document.getElementById('create-status').textContent = 'Ошибка: введите имя!';
                document.getElementById('create-status').style.color = '#f04747';
                return;
            }

            const createBtn = document.getElementById('create-save-btn');
            const statusMsg = document.getElementById('create-status');
            createBtn.disabled = true;
            statusMsg.textContent = 'Создание...';
            statusMsg.style.color = '#b9bbbe';

            const id = name.toLowerCase().replace(/[^a-zа-я0-9]/g, '') + '_' + Date.now();
            let imgUrl = '';

            const fileInput = document.getElementById('new-char-image');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${id}.${fileExt}`;
                statusMsg.textContent = 'Загрузка картинки...';
                
                const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(fileName, file);
                if (uploadError) {
                    statusMsg.textContent = 'Ошибка картинки: ' + uploadError.message;
                    statusMsg.style.color = '#f04747';
                    createBtn.disabled = false;
                    return;
                }
                const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                imgUrl = urlData.publicUrl;
            }

            const newData = { id: id, name: name, img_url: imgUrl };
            paramsList.forEach(param => {
                const textarea = document.getElementById(`create-input-${param.key}`);
                if (textarea && textarea.value.trim() !== '') newData[param.key] = textarea.value;
            });

            const { error } = await supabaseClient.from('characters').insert([newData]);

            if (error) {
                statusMsg.textContent = 'Ошибка: ' + error.message;
                statusMsg.style.color = '#f04747';
                createBtn.disabled = false;
            } else {
                allCharacters.push({ id: id, name: name, img: imgUrl });
                renderCards();
                statusMsg.textContent = 'Персонаж добавлен!';
                statusMsg.style.color = '#43b581';
                setTimeout(() => { closeCreateModal(); createBtn.disabled = false; }, 1000);
            }
        }

        document.getElementById('character-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.getElementById('create-modal').addEventListener('click', function(e) { if (e.target === this) closeCreateModal(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('character-modal').classList.contains('active')) closeModal();
                if (document.getElementById('create-modal').classList.contains('active')) closeCreateModal();
            }
        });

        init();
    </script>
</body>
</html>
